<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Yusuf Emir Gökdoğan: Software & Game Engineer. Unity için modular tools ve systems, itch.io oyunları ve GitHub projeleri." />

  <meta property="og:type" content="website" />

  <meta name="theme-color" content="#14101f" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css?v=202611262213" />
</head>
<body>
  <header class="nav">
    <a href="#top" class="logo pix">ygokdogan<span class="caret">▌</span></a>
    <nav>
      <a href="#about" data-i18n="navAbout"></a>
      <a href="#games" data-i18n="navGames"></a>
      <a href="#code" data-i18n="navCode"></a>
      <a href="#contact" data-i18n="navContact"></a>
      <button id="langBtn" class="lang pix" aria-label="Language">EN</button>
    </nav>
  </header>

  <section class="hero" id="top">
    <canvas id="sand" aria-hidden="true"></canvas>
    <h1 class="sr-only" id="name"></h1>
    <div class="hero-bottom">
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
      <div class="cta">
        <a class="btn primary" href="#games" data-i18n="seeGames" data-ic="play"></a>
        <a class="btn icon-btn" id="ghBtn" target="_blank" rel="noopener" aria-label="GitHub" data-tip="GitHub"><svg class="ic brand" aria-hidden="true"><use href="assets/icons.svg#i-brand-github"/></svg></a>
        <a class="btn icon-btn" id="itchBtn" target="_blank" rel="noopener" aria-label="itch.io" data-tip="itch.io"><svg class="ic brand" aria-hidden="true"><use href="assets/icons.svg#i-brand-itch"/></svg></a>
        <a class="btn icon-btn" id="liBtn" target="_blank" rel="noopener" aria-label="LinkedIn" data-tip="LinkedIn"><svg class="ic brand" aria-hidden="true"><use href="assets/icons.svg#i-brand-linkedin"/></svg></a>
      </div>
      <div class="hero-tools">
        <p class="hint pix" data-i18n="hint" data-ic="mouse-pointer-2"></p>
        <button id="clearSand" class="clear pix" data-i18n="clear" data-ic="eraser"></button>
      </div>
    </div>
  </section>

  <main>
    <section id="about" class="section">
      <h2 data-i18n="navAbout"></h2>
      <div class="about">
        <div class="about-text" id="aboutText"></div>
        <aside class="char">
          <p class="sheet-label pix" data-i18n="secProfile" data-ic="user-round"></p>
          <div class="char-top">
            <div class="portrait">
              <canvas id="avatarPx" width="288" height="288" aria-hidden="true"></canvas>
              <img id="avatar" alt="" />
            </div>
            <div>
              <p class="pix char-name" id="charName"></p>
              <a class="char-handle" id="charHandle" target="_blank" rel="noopener"></a>
              <p class="char-class" id="charClass"></p>
              <p class="char-meta" id="charMeta"></p>
            </div>
          </div>
          <p class="sheet-label pix" data-i18n="secStats" data-ic="bar-chart-3"></p>
          <div class="stats">
            <div><b class="pix" id="stGames">–</b><span data-i18n="stGames"></span></div>
            <div><b class="pix" id="stJams">–</b><span data-i18n="stJams"></span></div>
            <div><b class="pix" id="stRepos">–</b><span data-i18n="stRepos"></span></div>
            <div><b class="pix" id="stLangs">–</b><span data-i18n="stLangs"></span></div>
            <div><b class="pix" id="stStars">–</b><span data-i18n="stStars"></span></div>
            <div><b class="pix" id="stFollowers">–</b><span data-i18n="stFollowers"></span></div>
          </div>
          <p class="sheet-label pix"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#i-swords"/></svg><span data-i18n="secArsenal"></span><span class="sheet-hint" data-i18n="arsenalHint" data-ic="mouse-pointer-click"></span></p>
          <ul class="inv" id="skills"></ul>
          <div class="tech-panel" id="techPanel" hidden></div>
        </aside>
      </div>
      <div class="about-lower" id="aboutLower">
        <div class="lower-box" id="questsBox" hidden>
          <p class="sheet-label pix" data-i18n="secQuests" data-ic="scroll-text"></p>
          <div class="quests" id="questList"></div>
        </div>
        <div class="lower-box" id="achBox" hidden>
          <p class="sheet-label pix" data-i18n="secAch" data-ic="medal"></p>
          <div class="achs" id="achList"></div>
        </div>
      </div>
    </section>

    <section id="games" class="section">
      <h2 data-i18n="gamesTitle"></h2>
      <div class="gbar" id="gameBar">
        <button class="gbar-nav prev" id="gbarPrev" aria-label="Previous"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#i-chevron-left"/></svg></button>
        <div class="gtrack" id="gameTrack"></div>
        <button class="gbar-nav next" id="gbarNext" aria-label="Next"><svg class="ic" aria-hidden="true"><use href="assets/icons.svg#i-chevron-right"/></svg></button>
      </div>
      <div class="gmore"><button class="btn brand" id="gameMore" aria-expanded="false" aria-controls="gameGrid"></button></div>
      <div id="gameGrid" class="gshows" hidden></div>
    </section>

    <section id="code" class="section">
      <h2 data-i18n="codeTitle"></h2>
      <div id="featured"></div>
      <div class="filters" id="filters"></div>
      <div id="repoList" class="repos"></div>
    </section>

    <section id="contact" class="section contact">
      <h2 data-i18n="navContact"></h2>
      <p class="muted contact-text" data-i18n="contactText"></p>
      <div id="contactLinks" class="cta center"></div>
    </section>
  </main>

  <footer>
    <p class="muted small">© <span id="year"></span> <span id="footName"></span></p>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="data.js?v=202611262213"></script>
  <script src="js/utils.js?v=202611262213"></script>
  <script src="js/i18n.js?v=202611262213"></script>
  <script src="js/sand.js?v=202611262213"></script>
  <script src="js/games.js?v=202611262213"></script>
  <script src="js/projects.js?v=202611262213"></script>
  <script src="js/profile.js?v=202611262213"></script>
  <script src="js/main.js?v=202611262213"></script>
</body>
</html>
